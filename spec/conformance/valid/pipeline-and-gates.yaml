description: All optional pipeline and gate fields
org:
  spec: org/v1
  company:
    name: Example
  root_role: executive/ceo
  departments:
  - id: executive
    head: ceo
    activation: always
    roles:
    - ceo
    - chief-of-staff
  - id: engineering
    head: lead
    qa_gate:
      reviewer: qa
    roles:
    - lead
    - qa
  gates:
    legal:
      reviewer: executive/chief-of-staff
      triggers:
      - public_facing
      on_unavailable: waive
