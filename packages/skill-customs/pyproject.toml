[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "skill-customs"
dynamic = ["version"]
description = "Agent skills security: a lockfile, a license check, and commit pinning for the skills you install from GitHub. Scanners plug in."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["agent-skills", "agent-skills-security", "claude-skills", "ai-agents", "lockfile", "license-check", "supply-chain-security", "security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Build Tools",
  "Typing :: Typed",
]
dependencies = ["pyyaml>=6,<7"]

[project.urls]
Homepage = "https://github.com/goranai/try-professional"
Repository = "https://github.com/goranai/try-professional"
Documentation = "https://github.com/goranai/try-professional/blob/main/packages/skill-customs/README.md"
Issues = "https://github.com/goranai/try-professional/issues"

[project.scripts]
skill-customs = "skill_customs.cli:main"

[tool.hatch.version]
path = "src/skill_customs/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_customs"]
