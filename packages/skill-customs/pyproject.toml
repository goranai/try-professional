[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "skill-customs"
dynamic = ["version"]
description = "The lockfile, license, and pinning layer for agent skills. Scanners plug in."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["agents", "skills", "supply-chain", "lockfile", "license", "security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = ["pyyaml>=6,<7"]

[project.scripts]
skill-customs = "skill_customs.cli:main"

[tool.hatch.version]
path = "src/skill_customs/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_customs"]
