name: Publish to PyPI

# Trusted Publishing: PyPI trusts this workflow, in this repository and this environment, so no token exists to leak.
# It only runs when someone starts it by hand, from main, on a commit whose full CI run passed. It publishes one package
# at a time. try-professional depends on skill-customs, so skill-customs must be on PyPI first.
on:
  workflow_dispatch:
    inputs:
      package:
        description: The one package to publish
        required: true
        type: choice
        options:
          - skill-customs
          - try-professional

permissions:
  contents: read

env:
  PACKAGE: ${{ inputs.package }}

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require a passing full CI run on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
            --event workflow_dispatch --status success --json databaseId --jq length)
          if [ "$passed" -eq 0 ]; then
            echo "No passing manual CI run on $GITHUB_SHA. Run the CI workflow by hand first."
            exit 1
          fi
      - name: Require skill-customs on PyPI before try-professional
        if: inputs.package == 'try-professional'
        run: |
          if ! curl --silent --fail --output /dev/null https://pypi.org/pypi/skill-customs/0.1.0/json; then
            echo "try-professional depends on skill-customs, which isn't on PyPI yet. Publish that first."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build "packages/$PACKAGE" --outdir dist
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/${{ inputs.package }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
